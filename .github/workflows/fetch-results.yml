name: v1 — Fetch Match Results (Tue + Fri)

on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -q pandas requests python-dotenv

      - name: Fetch match results
        run: python src/data/fetch_football_data.py

      - name: Commit updated DB
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/db/winner.db
          git diff --staged --quiet || (git commit -m "data: refresh match results [skip ci]" && git push)

