# v2 daily maintenance.
#
# This exists for two reasons at once, and the second is the one that keeps
# biting us:
#
#   1. Results need ingesting. v1's feeder ran green for five months while
#      writing nothing; this one asserts freshness and fails when it is stale.
#   2. The Supabase project auto-pauses after ~7 days with no connections. It
#      has silently paused twice, and both times we found out only when
#      someone asked for a number. A daily job that actually touches the
#      database keeps it warm as a side effect of doing real work.
#
# NOTE: GitHub disables scheduled workflows after 60 days with no repository
# activity (no commits/pushes). It emails the repo owner first. If the schedule
# stops, re-enable it on the Actions tab - and remember the database clock
# starts ticking again the moment this stops running.

name: v2 — daily (ingest + freshness + dashboard)

on:
  schedule:
    # 05:15 UTC daily = 07:15 Israel in winter (UTC+2), 08:15 in summer (UTC+3).
    # Off the hour on purpose: GitHub's scheduler queues heavily at :00.
    # GitHub runs scheduled workflows on a best-effort queue, and this repo
    # sees them start 4.5 to 7.8 hours after the stated time (a 05:15 cron has
    # started anywhere from 09:49 to 13:05). The times below are therefore set
    # roughly six hours EARLIER than the hour we actually want, and are
    # staggered so each job still lands after the one it depends on even at the
    # extremes of that spread. Do not read them as the delivery time.
    # 21:00 UTC -> lands ~01:30-04:50 UTC. Late enough to catch European
    # evening kick-offs, early enough to be done before the Friday emails.
    - cron: '0 21 * * *'
  workflow_dispatch:

# One run at a time. Overlapping runs would fight over the same job_runs rows
# and the same upserts, so a second run waits for the first instead of doubling
# up (cancel-in-progress: false - never kill a run that is mid-write).
concurrency:
  group: v2-daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # ODDS_API_KEY is deliberately absent: nothing in this job calls the odds
      # API, and an unused secret in the job environment is only exposure. Add
      # it here if a pricing step is ever added.
      DATABASE_URL:      ${{ secrets.DATABASE_URL }}
      SOFASCORE_API_KEY: ${{ secrets.SOFASCORE_API_KEY }}
      PYTHONPATH:        .

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: v2/requirements.txt

      - name: Install dependencies
        run: pip install -q -r v2/requirements.txt

      # Fails if DATABASE_URL is unset or the project is paused, before we
      # spend any API quota finding out.
      - name: Check the database is awake
        run: |
          python - <<'PY'
          from v2.lib.jobs import connect
          with connect() as conn:
              print("  connected:", conn.execute("select now()").fetchone()[0])
          PY

      # `job()` treats "wrote nothing" as an error, which is right for a
      # twice-weekly job and wrong for a daily one: most midweek days have no
      # finished top-five-league matches at all, and a nuisance email every
      # Tuesday would train us to ignore the real ones. So an empty day is
      # tolerated here and *only* here - any other failure still stops the run,
      # and the freshness assertion below is the gate that actually matters.
      - name: Ingest finished matches and stats
        id: ingest
        continue-on-error: true
        run: |
          set -o pipefail
          python -m v2.ingest.results --pages 2 2>&1 | tee /tmp/ingest.log

      - name: Ingest upcoming fixtures
        id: fixtures
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SOFASCORE_API_KEY: ${{ secrets.SOFASCORE_API_KEY }}
        run: |
          set -o pipefail
          PYTHONPATH=. python -m v2.ingest.fixtures --days 10 2>&1 | tee /tmp/fixtures.log

      # Both the price fetch and the picker require odds_api_event_id, and
      # nothing in this job ever wrote one - so the fixture table could fill up
      # and the picker would still see "0 upcoming fixtures". Costs 0 credits.
      - name: Link fixtures to Odds API events
        id: mapodds
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          set -o pipefail
          PYTHONPATH=. python -m v2.scripts.map_odds_events 2>&1 | tee /tmp/mapped.log

      - name: Fetch cards and corners prices
        id: prices
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          set -o pipefail
          PYTHONPATH=. python -m v2.ingest.prices --days 8 2>&1 | tee /tmp/prices.log

      - name: Record and settle v1's live picks
        id: picks
        continue-on-error: true
        run: |
          set -o pipefail
          python -m v2.ingest.v1_picks 2>&1 | tee /tmp/picks.log

      # v2's own picks: recorded, never emailed. Most weeks nothing clears the
      # edge gate, which is the finding rather than a failure - and recording
      # the top-ranked pick anyway makes v1 and v2 comparable over a season.
      - name: Generate and record v2 picks
        id: v2picks
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          SOFASCORE_API_KEY: ${{ secrets.SOFASCORE_API_KEY }}
        run: |
          set -o pipefail
          PYTHONPATH=. python -m v2.recommend.picks --days 8 2>&1 | tee /tmp/v2picks.log

      # Settles pending picks from EITHER system by match_id. v1's picks were
      # settled as a side effect of re-reading v1's SQLite; v2's had no settler
      # at all, so two sat pending with results already in the database.
      - name: Settle any pending picks
        id: settle
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -o pipefail
          PYTHONPATH=. python -m v2.ingest.settle 2>&1 | tee /tmp/settle.log

      # Not "is the newest result recent" - that cannot tell a broken ingest
      # from an international break, and an 18-day gap in fixtures produced 11
      # straight red runs while everything worked. Ask instead whether any
      # match that has been PLAYED is missing its result.
      - name: Assert nothing played is missing a result
        id: assert
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -o pipefail
          PYTHONPATH=. python - <<'PY'
          from v2.lib.jobs import assert_no_missing_results, connect, job
          with job("assert-results", expect_rows=False), connect() as conn:
              assert_no_missing_results(conn, grace_hours=12)
          PY

      - name: Rebuild the betting-record dashboard
        if: always()
        run: python -m v2.scripts.build_dashboard

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard
          path: v2/web/dashboard.html
          retention-days: 30

      # One gate, at the end, rather than an abort after each tolerant step.
      # The old arrangement exited 1 immediately after the results ingest, so a
      # single broken step starved everything behind it: five mornings running,
      # no fixtures, no prices, no picks and no dashboard rebuild, because
      # SofaScore had returned one status spelling we did not map. Let every
      # step run, then decide.
      - name: Fail the run if any step failed
        if: always()
        run: |
          # One space-separated token per step, in pipeline order. Not a bash
          # associative array - those iterate in hash order, and this log is
          # read by a person trying to see where the pipeline broke.
          BAD=0
          for pair in \
            "ingest-results:${{ steps.ingest.outcome }}" \
            "ingest-fixtures:${{ steps.fixtures.outcome }}" \
            "map-odds-events:${{ steps.mapodds.outcome }}" \
            "fetch-prices:${{ steps.prices.outcome }}" \
            "track-v1-picks:${{ steps.picks.outcome }}" \
            "v2-picks:${{ steps.v2picks.outcome }}" \
            "settle-picks:${{ steps.settle.outcome }}" \
            "assert-results:${{ steps.assert.outcome }}"
          do
            step="${pair%%:*}"
            outcome="${pair#*:}"
            printf '  %-18s %s\n' "$step" "${outcome:-did-not-run}"
            # Anything that is not "success" is a problem, not just "failure".
            # A 20-minute job timeout marks steps "cancelled" and the rest
            # "skipped", and a gate that looked only for "failure" printed
            # "all pipeline steps ok" over a job that had been killed mid-run.
            if [ "$outcome" != "success" ]; then BAD=1; fi
          done
          if [ "$BAD" = 1 ]; then
            echo "::error::one or more pipeline steps did not succeed - see the outcomes above"
            exit 1
          fi
          echo "all pipeline steps ok"

      # Silence is the failure mode this whole workflow is about, so a failed
      # run has to arrive somewhere a person looks. The red X on the Actions
      # tab is not that place.
      - name: Report failure by email
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [ -z "$RESEND_API_KEY" ]; then
            echo "::error::v2-daily failed and RESEND_API_KEY is not set, so no email was sent."
            exit 1
          fi
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          STATUS=$(curl -s -o /tmp/resend.out -w '%{http_code}' \
            -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"from\":\"Winner v2 <onboarding@resend.dev>\",
                 \"to\":[\"idoshveki@gmail.com\"],
                 \"subject\":\"v2 daily FAILED - $GITHUB_REPOSITORY\",
                 \"html\":\"<p>The v2 daily job failed. Likely causes: the Supabase project is paused again, DATABASE_URL is wrong, or a played match is missing its result.</p><p><a href=\\\"$RUN_URL\\\">Open the run log</a></p>\"}")
          echo "resend http $STATUS"; cat /tmp/resend.out; echo
          if [ "$STATUS" != "200" ]; then
            echo "::error::v2-daily failed AND the failure email could not be sent (HTTP $STATUS)."
            exit 1
          fi
          echo "::error::v2-daily failed. Failure email sent."
          exit 1
