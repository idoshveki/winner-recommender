name: v1 — Send Weekly Picks (Friday)

on:
  schedule:
    # GitHub runs scheduled workflows on a best-effort queue, and this repo
    # sees them start 4.5 to 7.8 hours after the stated time (a 05:15 cron has
    # started anywhere from 09:49 to 13:05). The times below are therefore set
    # roughly six hours EARLIER than the hour we actually want, and are
    # staggered so each job still lands after the one it depends on even at the
    # extremes of that spread. Do not read them as the delivery time.
    # 01:00 Friday UTC -> lands ~05:30-08:50 UTC (08:30-11:50 Israel).
    # Self-contained: it syncs history from Postgres and fetches its own
    # odds, so it only needs v2-daily's results to be in, which they are.
    - cron: '0 1 * * 5'
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -q -r v2/requirements.txt pandas resend

      # v1's own results feeder has written nothing since 2026-03-09, so every
      # history-derived feature was seven months stale - and the yellow-card
      # averages are the ones that matter, because yc_pred could never reach
      # its 6.0 gate without current-season rows. v2 ingests the same matches
      # into Postgres daily; copy them across before picking.
      - name: Refresh history from v2's database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: PYTHONPATH=. python -m v2.scripts.sync_v1_history

      - name: Fetch latest odds
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python src/data/fetch_odds.py

      - name: Generate + send picks
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          SOFASCORE_API_KEY: ${{ secrets.SOFASCORE_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python src/recommend/send_weekly.py

      # v1 writes its picks to its own SQLite, and the dashboard reads Postgres.
      # Until now only v2-daily bridged the two, and it runs at 21:00 while this
      # job lands in the morning - so a Friday slip sat invisible for about
      # twenty hours, which is most of the window in which the bets are still
      # placeable. The job that creates the picks now publishes them.
      - name: Track this week's picks into the record
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -o pipefail
          PYTHONPATH=. python -m v2.ingest.v1_picks

      - name: Rebuild and publish the dashboard
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -o pipefail
          PYTHONPATH=. python -m v2.scripts.build_dashboard
          mkdir -p _site
          cp v2/web/dashboard.html _site/index.html
          test -s _site/index.html || { echo "::error::dashboard is empty"; exit 1; }

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Commit updated DB (picks saved)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git stash --include-untracked
          git pull --rebase
          git stash pop
          git add data/db/winner.db
          git diff --staged --quiet || (git commit -m "data: save weekly picks [skip ci]" && git push)
