name: v1 — Send Weekly Picks (Friday)

on:
  schedule:
    - cron: '0 6 * * 5'   # 8am Israel (UTC+2), Friday
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -q pandas requests python-dotenv resend 'psycopg[binary]'

      # v1's own results feeder has written nothing since 2026-03-09, so every
      # history-derived feature was seven months stale - and the yellow-card
      # averages are the ones that matter, because yc_pred could never reach
      # its 6.0 gate without current-season rows. v2 ingests the same matches
      # into Postgres daily; copy them across before picking.
      - name: Refresh history from v2's database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: PYTHONPATH=. python -m v2.scripts.sync_v1_history

      - name: Fetch latest odds
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python src/data/fetch_odds.py

      - name: Generate + send picks
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          SOFASCORE_API_KEY: ${{ secrets.SOFASCORE_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python src/recommend/send_weekly.py

      - name: Commit updated DB (picks saved)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git stash --include-untracked
          git pull --rebase
          git stash pop
          git add data/db/winner.db
          git diff --staged --quiet || (git commit -m "data: save weekly picks [skip ci]" && git push)
