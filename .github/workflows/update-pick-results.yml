name: v1 — Auto-fill Pick Results (Tue + Fri)

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -q pandas requests python-dotenv

      - name: Auto-fill pick results
        run: python src/data/update_pick_results.py

      - name: Commit updated DB
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase
          git add data/db/winner.db
          git diff --staged --quiet || (git commit -m "data: auto-fill pick results [skip ci]" && git push)

# DISABLED 2026-09-13 — manual dispatch only.
#
# 37 of its 40 runs failed. The script writes to winner.db and only THEN runs
# `git pull --rebase`, which git refuses: "cannot pull with rebase: You have
# unstaged changes". It also depends on matches_history, which the job above
# never updated, so even its successful runs had nothing to match against.
#
# Superseded by v2: `python -m v2.ingest.v1_picks` records every v1 pick and
# settles it against current results, writing to Postgres instead of racing
# three other bots over a 74MB binary in git.
